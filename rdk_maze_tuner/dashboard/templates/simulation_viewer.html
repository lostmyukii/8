<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Webots 实时物理仿真</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #071217;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      webots-view {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      webots-view {
        display: block;
        background: #071217;
      }

      #viewerStatus {
        position: fixed;
        z-index: 10;
        top: 12px;
        left: 50%;
        max-width: calc(100% - 24px);
        padding: 7px 10px;
        color: #dceef3;
        background: rgb(7 18 23 / 78%);
        border: 1px solid rgb(112 194 213 / 32%);
        transform: translateX(-50%);
        font-size: 11px;
        letter-spacing: 0.03em;
        pointer-events: none;
      }

      #viewerStatus[data-state="ready"] {
        opacity: 0;
        transition: opacity 800ms ease 1200ms;
      }

      #viewerStatus[data-state="error"] {
        color: #fecaca;
        border-color: rgb(248 113 113 / 50%);
      }
    </style>
  </head>
  <body>
    <webots-view id="webotsView"></webots-view>
    <div id="viewerStatus" role="status" aria-live="polite">正在连接 Webots 物理仿真…</div>
    <script type="module" src="https://cyberbotics.com/wwi/R2025a/WebotsView.js"></script>
    <script type="module" src="/static/simulation_viewer.js"></script>
  </body>
</html>
