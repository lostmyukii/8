name: maze-car-ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rdk-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall rdk_maze_tuner simulation
      - run: python -m pytest rdk_maze_tuner/tests -q

  esp32-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "platformio>=6.1"
      - run: pio run
        working-directory: esp32_firmware
