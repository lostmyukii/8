#VRML_SIM R2025a utf8
# template language: javascript

PROTO PhysicalMazeCar [
  field SFVec3f translation 0 0 0
  field SFRotation rotation 0 1 0 0
  field SFString name "physical_maze_car"
  field SFString controller "maze_physical_controller"
  field MFString controllerArgs []
  field SFBool supervisor TRUE
  field SFFloat wheelRadius 0.0325
  field SFFloat wheelWidth 0.026
  field SFFloat axleTrack 0.135
  field SFFloat chassisLength 0.23
  field SFFloat chassisWidth 0.16
  field SFFloat bodyMass 1.08
  field SFFloat wheelMass 0.06
  field MFVec3f centerOfMass [ 0 0.07 0.01 ]
  field MFVec3f inertiaMatrix [
    0.00768 0.00707 0.00522
    0 0 0
  ]
  field SFFloat maxWheelVelocity 20
  field SFFloat maxWheelTorque 0.60
  field MFVec3f tofLookupTable [
    0.03 0.03 0
    2 2 0
  ]
  field SFString leftContactMaterial "maze_tire_left"
  field SFString rightContactMaterial "maze_tire_right"
  field SFString casterContactMaterial "maze_caster"
] {
  %<
    const halfTrack = fields.axleTrack.value * 0.5;
    const wheelRadius = fields.wheelRadius.value;
    const wheelWidth = fields.wheelWidth.value;
    const chassisLength = fields.chassisLength.value;
    const chassisWidth = fields.chassisWidth.value;
  >%
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    model "RDK X3 ESP32 physical maze car"
    controller IS controller
    controllerArgs IS controllerArgs
    supervisor IS supervisor
    synchronization TRUE
    children [
      # Blue aluminium chassis. Visual detail is intentionally separate from
      # the primitive collision body below.
      Transform {
        translation 0 0.0625 0
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.03 0.28 0.78
              roughness 0.42
              metalness 0.28
            }
            geometry Box {
              size %<= chassisWidth >% 0.045 %<= chassisLength >%
            }
          }
        ]
      }
      Transform {
        translation 0 0.105 0.012
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.02 0.24 0.15
              roughness 0.6
              metalness 0.05
            }
            geometry Box {
              size 0.12 0.012 0.11
            }
          }
        ]
      }
      Transform {
        translation 0 0.132 0.012
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.17 0.17 0.2
              roughness 0.55
            }
            geometry Box {
              size 0.085 0.035 0.075
            }
          }
        ]
      }
      Transform {
        translation 0 0.112 -0.121
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.04 0.04 0.045
              roughness 0.32
              metalness 0.15
            }
            geometry Box {
              size 0.048 0.036 0.024
            }
          }
          Transform {
            translation 0 0 -0.014
            rotation 0 1 0 1.5708
            children [
              Shape {
                appearance PBRAppearance {
                  baseColor 0.08 0.12 0.16
                  roughness 0.2
                }
                geometry Cylinder {
                  height 0.012
                  radius 0.013
                  subdivision 20
                }
              }
            ]
          }
        ]
      }
      DEF LEFT_WHEEL_JOINT HingeJoint {
        jointParameters HingeJointParameters {
          position 0
          axis -1 0 0
          anchor %<= -halfTrack >% %<= wheelRadius >% 0.018
          dampingConstant 0.0008
          staticFriction 0.0004
        }
        device [
          RotationalMotor {
            name "left wheel motor"
            maxVelocity IS maxWheelVelocity
            maxTorque IS maxWheelTorque
          }
          PositionSensor {
            name "left wheel encoder"
            resolution 0.005696
          }
        ]
        endPoint Solid {
          translation %<= -halfTrack >% %<= wheelRadius >% 0.018
          rotation 0 0 1 1.5708
          children [
            Shape {
              appearance DEF TIRE_APPEARANCE PBRAppearance {
                baseColor 0.018 0.018 0.022
                roughness 0.98
                metalness 0
              }
              geometry Cylinder {
                height %<= wheelWidth >%
                radius %<= wheelRadius >%
                subdivision 24
              }
            }
            Shape {
              appearance PBRAppearance {
                baseColor 0.95 0.65 0.08
                roughness 0.4
              }
              geometry Cylinder {
                height %<= wheelWidth + 0.001 >%
                radius %<= wheelRadius * 0.38 >%
                subdivision 20
              }
            }
            # A high-contrast tread mark rotates with the wheel, making
            # physical motion directly observable in the live stream.
            Transform {
              translation 0 0 %<= wheelRadius + 0.001 >%
              children [
                Shape {
                  appearance DEF WHEEL_MOTION_MARKER PBRAppearance {
                    baseColor 0.95 0.12 0.08
                    roughness 0.35
                    emissiveColor 0.12 0.01 0.005
                  }
                  geometry Box {
                    size 0.009 %<= wheelWidth + 0.002 >% 0.003
                  }
                }
              ]
            }
          ]
          name "left drive wheel"
          contactMaterial IS leftContactMaterial
          boundingObject Cylinder {
            height %<= wheelWidth >%
            radius %<= wheelRadius >%
            subdivision 24
          }
          physics Physics {
            density -1
            mass IS wheelMass
          }
        }
      }
      DEF RIGHT_WHEEL_JOINT HingeJoint {
        jointParameters HingeJointParameters {
          position 0
          axis -1 0 0
          anchor %<= halfTrack >% %<= wheelRadius >% 0.018
          dampingConstant 0.0008
          staticFriction 0.0004
        }
        device [
          RotationalMotor {
            name "right wheel motor"
            maxVelocity IS maxWheelVelocity
            maxTorque IS maxWheelTorque
          }
          PositionSensor {
            name "right wheel encoder"
            resolution 0.005696
          }
        ]
        endPoint Solid {
          translation %<= halfTrack >% %<= wheelRadius >% 0.018
          rotation 0 0 1 1.5708
          children [
            Shape {
              appearance USE TIRE_APPEARANCE
              geometry Cylinder {
                height %<= wheelWidth >%
                radius %<= wheelRadius >%
                subdivision 24
              }
            }
            Shape {
              appearance PBRAppearance {
                baseColor 0.95 0.65 0.08
                roughness 0.4
              }
              geometry Cylinder {
                height %<= wheelWidth + 0.001 >%
                radius %<= wheelRadius * 0.38 >%
                subdivision 20
              }
            }
            Transform {
              translation 0 0 %<= wheelRadius + 0.001 >%
              children [
                Shape {
                  appearance USE WHEEL_MOTION_MARKER
                  geometry Box {
                    size 0.009 %<= wheelWidth + 0.002 >% 0.003
                  }
                }
              ]
            }
          ]
          name "right drive wheel"
          contactMaterial IS rightContactMaterial
          boundingObject Cylinder {
            height %<= wheelWidth >%
            radius %<= wheelRadius >%
            subdivision 24
          }
          physics Physics {
            density -1
            mass IS wheelMass
          }
        }
      }
      DEF CASTER_JOINT BallJoint {
        jointParameters BallJointParameters {
          anchor 0 0.012 -0.084
          dampingConstant 0.001
          staticFriction 0.0002
        }
        endPoint Solid {
          translation 0 0.012 -0.084
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.55 0.58 0.62
                roughness 0.3
                metalness 0.75
              }
              geometry Sphere {
                radius 0.012
                subdivision 2
              }
            }
            Transform {
              translation 0 0.009 -0.009
              children [
                Shape {
                  appearance PBRAppearance {
                    baseColor 0.04 0.82 0.95
                    roughness 0.3
                    emissiveColor 0.005 0.08 0.1
                  }
                  geometry Sphere {
                    radius 0.0035
                    subdivision 2
                  }
                }
              ]
            }
          ]
          name "passive caster"
          contactMaterial IS casterContactMaterial
          boundingObject Sphere {
            radius 0.012
            subdivision 2
          }
          physics Physics {
            density -1
            mass 0.001
          }
        }
      }
      DistanceSensor {
        translation 0 0.072 -0.119
        rotation 0 1 0 1.5708
        name "tof front"
        type "laser"
        numberOfRays 1
        aperture 0.436332
        resolution 0.001
        lookupTable IS tofLookupTable
      }
      DistanceSensor {
        translation -0.081 0.072 -0.01
        rotation 0 1 0 3.141593
        name "tof left"
        type "laser"
        numberOfRays 1
        aperture 0.436332
        resolution 0.001
        lookupTable IS tofLookupTable
      }
      DistanceSensor {
        translation 0.081 0.072 -0.01
        name "tof right"
        type "laser"
        numberOfRays 1
        aperture 0.436332
        resolution 0.001
        lookupTable IS tofLookupTable
      }
      InertialUnit {
        translation 0 0.11 0.012
        name "imu"
      }
      Gyro {
        translation 0 0.11 0.012
        name "gyro"
      }
      Accelerometer {
        translation 0 0.11 0.012
        name "accelerometer"
      }
    ]
    boundingObject Transform {
      translation 0 0.0625 0
      children [
        Box {
          size %<= chassisWidth >% 0.045 %<= chassisLength >%
        }
      ]
    }
    physics Physics {
      density -1
      mass IS bodyMass
      centerOfMass IS centerOfMass
      inertiaMatrix IS inertiaMatrix
      damping Damping {
        linear 0.02
        angular 0.03
      }
    }
  }
}
